:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#262626;background:#e9e9e7}*{box-sizing:border-box}body{margin:0}.app{height:100dvh;max-width:640px;margin:auto;display:flex;flex-direction:column;background:#ededed}.top{padding:calc(env(safe-area-inset-top) + 14px) 17px 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dedede;background:#f5f5f5}.top strong{font-size:17px}.top button,.toolbar button,.composer button,.settings button{border:0;background:transparent;font:inherit;cursor:pointer}.top button{font-size:22px}.msgs{flex:1;overflow:auto;padding:24px 14px 16px;display:flex;flex-direction:column;gap:17px}.stamp{text-align:center;color:#999;font-size:12px}.message{display:flex;align-items:flex-start;gap:9px;max-width:90%}.message.me{align-self:flex-end;flex-direction:row-reverse}.avatar{width:43px;height:43px;border-radius:5px;object-fit:cover;flex-shrink:0}.bubble{background:#fff;border-radius:7px;padding:11px 13px;font-size:15px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.me .bubble{background:#95ec69}.bubble img{max-width:min(230px,55vw);max-height:300px;display:block;border-radius:5px;object-fit:contain}.system{align-self:center;color:#929292;font-size:12px;text-align:center;max-width:90%;line-height:1.6}.composer{background:#f7f7f7;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;align-items:flex-end;gap:10px;border-top:1px solid #ddd}.composer textarea{flex:1;border:1px solid #e3e3e3;border-radius:7px;min-height:40px;max-height:130px;resize:none;padding:9px;font:15px/1.5 inherit;background:#fff}.composer button{height:40px;border:0;background:#07b75a;color:#fff;border-radius:6px;padding:0 13px;font-weight:600}.composer .photo{background:none;color:#555;padding:0 4px;font-size:23px}.tabs{display:flex;gap:0;background:#fafafa;border-bottom:1px solid #ddd}.tabs button{flex:1;padding:12px 6px;background:transparent;border:0;font-size:14px;color:#666}.tabs button.active{color:#07a550;border-bottom:2px solid #07b75a;font-weight:700}.settings{padding:22px;overflow:auto;flex:1;background:#f7f7f7}.profile{display:flex;align-items:center;gap:15px;background:#fff;padding:14px;margin-bottom:14px;border-radius:10px}.profile img{width:70px;height:70px;object-fit:cover;border-radius:8px}.profile button{background:#edf5ed;border:0;border-radius:6px;padding:8px 10px;margin-top:6px}.settings p{font-size:13px;color:#777;line-height:1.7}.settings input{width:100%;padding:12px;border:1px solid #ddd;border-radius:7px}.settings .save{background:#07b75a;color:#fff;padding:10px 16px;border-radius:6px;margin-top:10px}.hidden{display:none!important}.status{padding:8px;text-align:center;color:#9a6a36;font-size:12px;background:#fff4df}.story{background:#fff;padding:16px;border-radius:10px;line-height:1.8;font-size:15px;margin:16px}.story h3{margin:0 0 8px}.story button{border:0;background:#95ec69;padding:10px 15px;border-radius:6px}.note{font-size:12px;color:#888;margin-top:10px}

/* WeChat-inspired redesign v2 */
:root{background:#d6d9dc}body{background:#d6d9dc}.app{max-width:1120px;margin:0 auto;box-shadow:0 12px 50px #0002;position:relative;background:#ededed}
.top{height:61px;padding:10px 20px;background:#f5f5f5;border-bottom:1px solid #ddd;justify-content:center;position:relative;flex-shrink:0}.top strong{font-size:17px;font-weight:600}.top button:first-child{position:absolute;left:20px}.top button:last-child{position:absolute;right:20px}
.tabs{position:absolute;left:0;top:61px;width:264px;bottom:0;display:flex;flex-direction:column;background:#e7e7e7;border-right:1px solid #d2d2d2;border-bottom:0;padding-top:16px;z-index:2}.tabs button{flex:0;text-align:left;padding:18px 20px;border-bottom:1px solid #dedede;font-size:15px}.tabs button.active{background:#c9c9c9;color:#222;border:0;font-weight:600}
.msgs{margin-left:264px;padding:24px 28px;gap:22px}.composer{margin-left:264px;min-height:82px;align-items:center;padding:12px 22px}.composer textarea{border:0;outline:0;min-height:43px;background:#fff}.composer button{background:#07c160}.composer .photo{font-size:29px;color:#666}.status{margin-left:264px;background:#f5f2e9;color:#8b785a}.message{max-width:83%;gap:12px}.avatar{width:42px;height:42px;border-radius:5px}.bubble{position:relative;max-width:540px;border-radius:5px;padding:10px 13px;line-height:1.65;box-shadow:0 1px 1px #0000000a}.bubble:before{content:'';position:absolute;left:-6px;top:14px;width:12px;height:12px;background:#fff;transform:rotate(45deg)}.me .bubble:before{left:auto;right:-6px;background:#95ec69}.message.me{margin-left:auto}.settings{margin-left:264px}.settings.hidden{display:none!important}#story{margin-left:264px!important}.stamp{margin:2px auto 0}.system{margin:0 auto;background:#d7d7d7;color:#fff;padding:4px 9px;border-radius:4px}.profile{border-radius:5px}
@media(max-width:700px){.app{max-width:none;box-shadow:none}.tabs{position:static;flex-direction:row;width:auto;padding:0;border-right:0;background:#f7f7f7}.tabs button{flex:1;text-align:center;padding:10px 4px;font-size:13px}.tabs button.active{background:transparent;color:#07a550;border-bottom:2px solid #07c160}.msgs,.composer,.status,.settings,#story{margin-left:0!important}.msgs{padding:22px 14px}.composer{min-height:64px;padding:9px 12px calc(env(safe-area-inset-bottom) + 9px)}.message{max-width:94%}.bubble{max-width:calc(100vw - 125px)}.top{height:56px}.top button:first-child{left:14px}.top button:last-child{right:14px}}
</style></head><body><div class="app"><header class="top"><button id="back" aria-label="返回">‹</button><strong>付彬言</strong><button id="settingsBtn" aria-label="設定">⋯</button></header><nav class="tabs"><button id="chatTab" class="active">微信聊天</button><button id="storyTab">現實劇情</button></nav><div id="status" class="status">尚未連接 AI：可以瀏覽與輸入訊息，連接服務後才會有自由回覆。</div><main id="msgs" class="msgs"></main><section id="story" class="hidden" style="flex:1;overflow:auto"><div class="story"><h3>目前的故事</h3><p>毛毛和付彬言已經互相表明心意。今天他牽著毛毛的手，送她回家，約好明天再見。晚上，兩人開始傳訊息。</p><p>這裡與微信聊天共用故事記憶；後續可在此擴充完整的面對面互動場景。</p><button id="storyContinue">回到今晚的聊天</button></div></section><form id="composer" class="composer"><button class="photo" type="button" id="photoBtn" title="傳送照片">⊕</button><textarea id="input" rows="1" placeholder="傳訊息給付彬言……"></textarea><button type="submit" id="send">傳送</button></form><section id="settings" class="settings hidden"><h3>個人資料與頭像</h3><div class="profile"><img id="hisPreview" src="assets/fubinyan.jpeg"><div><b>付彬言</b><div><button id="hisChange">更換他的頭像</button></div></div></div><div class="profile"><img id="myPreview" src="assets/maomao.jpeg"><div><b>毛毛</b><div><button id="myChange">更換我的頭像</button></div></div></div><p>頭像與對話儲存在目前這台裝置的瀏覽器。清除網站資料可能會遺失；正式雲端版可再加入帳號同步。</p><h3>AI 連線</h3><p>若網站部署了隨附的伺服器並設定 OPENAI_API_KEY，就能自由對話。請勿在此頁輸入 API 金鑰。</p><button class="save" id="closeSettings">返回聊天</button><h3>聊天資料</h3><button id="export">匯出聊天紀錄</button>　<button id="reset">重設為起始存檔</button></section><input id="hisFile" type="file" accept="image/*" hidden><input id="myFile" type="file" accept="image/*" hidden><input id="photoFile" type="file" accept="image/*" hidden></div><script>
const key='fubinyan-maomao-v1';const initial=[{who:'system',text:'故事存檔：你們已經表白、牽手，今天付彬言送毛毛回家。'},{who:'me',text:'我洗好澡啦 你有乖乖到家嗎'},{who:'him',text:'算了。我負責。\n\n……吹乾了再來找我。我等你。'}];let data;try{data=JSON.parse(localStorage.getItem(key))||{messages:initial,his:'assets/fubinyan.jpeg',me:'assets/maomao.jpeg'}}catch{data={messages:initial,his:'assets/fubinyan.jpeg',me:'assets/maomao.jpeg'}};const $=x=>document.getElementById(x);const save=()=>{try{localStorage.setItem(key,JSON.stringify(data))}catch{alert('儲存空間不足，請改用較小的圖片。')}};function render(){const el=$('msgs');el.innerHTML='';for(const m of data.messages){const div=document.createElement('div');if(m.who==='system'){div.className='system';div.textContent=m.text}else{div.className='message '+(m.who==='me'?'me':'');const avatar=document.createElement('img');avatar.className='avatar';avatar.src=m.who==='me'?data.me:data.his;const bubble=document.createElement('div');bubble.className='bubble';if(m.image){const pic=document.createElement('img');pic.src=m.image;bubble.append(pic)}if(m.text){const t=document.createElement('span');t.textContent=m.text;bubble.append(t)}div.append(avatar,bubble)}el.append(div)}el.scrollTop=el.scrollHeight;$('hisPreview').src=data.his;$('myPreview').src=data.me}function tab(mode){$('msgs').classList.toggle('hidden',mode!=='chat');$('composer').classList.toggle('hidden',mode!=='chat');$('story').classList.toggle('hidden',mode!=='story');$('settings').classList.toggle('hidden',mode!=='settings');$('status').classList.toggle('hidden',mode==='settings');$('chatTab').classList.toggle('active',mode==='chat');$('storyTab').classList.toggle('active',mode==='story')};$('chatTab').onclick=()=>tab('chat');$('storyTab').onclick=()=>tab('story');$('storyContinue').onclick=()=>tab('chat');$('settingsBtn').onclick=()=>tab('settings');$('closeSettings').onclick=()=>tab('chat');$('back').onclick=()=>tab('chat');$('hisChange').onclick=()=>$('hisFile').click();$('myChange').onclick=()=>$('myFile').click();$('photoBtn').onclick=()=>$('photoFile').click();function loadImage(file,cb){if(!file)return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file)}$('hisFile').onchange=e=>loadImage(e.target.files[0],v=>{data.his=v;save();render()});$('myFile').onchange=e=>loadImage(e.target.files[0],v=>{data.me=v;save();render()});$('photoFile').onchange=e=>loadImage(e.target.files[0],v=>{data.messages.push({who:'me',image:v});save();render();reply()});$('composer').onsubmit=async e=>{e.preventDefault();const val=$('input').value.trim();if(!val)return;data.messages.push({who:'me',text:val});$('input').value='';save();render();await reply()};$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('composer').requestSubmit()}});let busy=false;async function reply(){if(busy)return;busy=true;$('send').disabled=true;$('status').textContent='付彬言正在輸入……';try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:data.messages.slice(-60).map(m=>({who:m.who,text:m.text||'',image:m.image||null}))})});if(!response.ok)throw Error('AI 尚未連線（'+response.status+'）');const result=await response.json();if(!result.reply)throw Error('AI 沒有回傳內容');data.messages.push({who:'him',text:result.reply});save();render();$('status').textContent='已連接 AI · 自由對話'}catch(err){$('status').textContent=err.message+'。訊息已儲存，可在連線後繼續。'}finally{busy=false;$('send').disabled=false}}$('export').onclick=()=>{const blob=new Blob([JSON.stringify(data.messages,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='毛毛與付彬言-聊天存檔.json';a.click();URL.revokeObjectURL(a.href)};$('reset').onclick=()=>{if(confirm('確定清除聊天並恢復起始存檔？')){data.messages=structuredClone(initial);save();render();tab('chat')}};render();
</script></body></html>
